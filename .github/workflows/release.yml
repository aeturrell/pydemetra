name: Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write # Required for Trusted Publishing

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # This environment name MUST match what you configured on PyPI
    environment:
      name: release

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4 # Updated to v4 (stable)
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"

      - name: Check if there is a parent commit
        id: check-parent-commit
        run: |
          echo "sha=$(git rev-parse --verify --quiet HEAD^)" >> $GITHUB_OUTPUT

      - name: Detect and tag new version
        id: check-version
        if: steps.check-parent-commit.outputs.sha
        uses: salsify/action-detect-and-tag-new-version@v2
        with:
          version-command: |
            uvx --from=toml-cli toml get --toml-path=pyproject.toml project.version

      - name: Bump version for developmental release
        if: "! steps.check-version.outputs.tag"
        run: |
          uv run version_bumper.py &&
          version=$(uvx --from=toml-cli toml get --toml-path=pyproject.toml project.version) &&
          uvx --from=toml-cli toml set --toml-path=pyproject.toml project.version $version.dev.$(date +%s)

      - name: Build package
        run: |
          uv build

      - name: Publish package on PyPI
        if: steps.check-version.outputs.tag
        uses: pypa/gh-action-pypi-publish@v1.13.0
        # No user/password needed here for Trusted Publishing!

      - name: Publish the release notes
        uses: release-drafter/release-drafter@v6
        with:
          publish: ${{ steps.check-version.outputs.tag != '' }}
          tag: ${{ steps.check-version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          uv sync --group dev
          uv pip install -e .

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.32

      - name: Build autodocs
        run: uv run quartodoc build --config docs/_quarto.yml

      - name: Build docs
        run: cd docs; uv run quarto render --execute

      - name: git config
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)" &&
          git config user.email "$(git log -n 1 --pretty=format:%ae)"

      - name: Publish Docs
        if: steps.check-version.outputs.tag
        run: cd docs; uv run quarto publish gh-pages --no-render --no-browser
